<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body>

<header class="bg-blue-400 h-[80px] flex items-center">

    <!-- User Image -->
    <div>
        <img src="./asstes/user.png"
             alt="user"
             class="w-[28px] h-[28px] md:w-[32px] md:h-[32px] lg:w-[36px] lg:h-[36px] ml-[2px] rounded-full object-cover">
    </div>

    <!-- Icons -->
    <section>
        <ul class="flex gap-[8px] md:gap-[12px] lg:gap-[16px] pl-[8px] md:pl-[12px] lg:pl-[16px]">
            <li>
                <img src="./asstes/Icon.svg" alt="icon">
            </li>

            <li>
                <img src="./asstes/Icon (1).svg" alt="icon">
            </li>
        </ul>
    </section>

    <!-- Search -->
    <div class="relative">
        <input 
            type="text" 
            placeholder="Search destinations..."
            class="border rounded-full px-3 pl-[36.86px]

                   md:w-[210px] md:h-[50px] md:ml-[12px]
                   lg:w-[244px] lg:h-[58px] lg:ml-[24px]"
        >

        <img 
            src="./asstes/Icon (2).svg"
            alt="search"
            class="absolute right-[12px] top-1/2 -translate-y-1/2 
                   w-[16px] h-[16px] 
                   lg:w-[18px] lg:h-[18px]"
        >
    </div>

    <!-- Navigation -->
    <section>
        <ul class="flex 
                   gap-[12px] ml-[20px]
                   md:gap-[20px] md:ml-[50px]
                   lg:gap-[32px] lg:ml-[171.15px]">

            <li>
                <a href="">Blog</a>
            </li>

            <li>
                <a href="">Products</a>
            </li>

            <li>
                <a href="">About</a>
            </li>

            <li>
                <a href="">Home</a>
            </li>

        </ul>
    </section>

    <!-- Last Image -->
    <section class="w-[100px] h-[40px] 
                    md:w-[120px] md:h-[44px] 
                    lg:w-[144.5px] lg:h-[48px] 
                    ml-auto">

        <img src="./asstes/Container (1) (1).png" alt="">
        
    </section>

</body>
